<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat 宿主能力验证</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; color: light-dark(#242428,#f5f5f5); background: light-dark(#f7f7f8,#1d1d20); }
    main { max-width: 590px; padding: 14px; border: 1px solid light-dark(#c5c5cb,#6a6a72); border-radius: 10px; background: light-dark(#fff,#28282d); }
    h1 { margin: 0 0 6px; font-size: 16px; }
    p { margin: 5px 0 10px; }
    dl { display: grid; grid-template-columns: minmax(145px,1fr) minmax(140px,2fr); gap: 7px 12px; margin: 12px 0; }
    dt { color: light-dark(#59616c,#bac0ca); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .note { padding-top: 10px; border-top: 1px solid light-dark(#e5e5e8,#48484f); color: light-dark(#59616c,#bac0ca); }
  </style>
</head>
<body>
  <main data-probe="chat-host-capabilities">
    <h1>Chat 宿主能力验证</h1>
    <p>仅检查公开的插件组件接口及卡片显示位置；不读取对话、页面节点或凭证。</p>
    <dl>
      <dt>组件桥接</dt><dd id="bridge">检测中…</dd>
      <dt>工具结果</dt><dd id="result">检测中…</dd>
      <dt>主题信号</dt><dd id="theme">检测中…</dd>
      <dt>展示模式</dt><dd id="mode">检测中…</dd>
      <dt>组件状态接口</dt><dd id="state">检测中…</dd>
    </dl>
    <p class="note">这张卡片即使在 Chat 中显示，也只证明插件 iframe 可渲染。它不证明能读取当前 Chat 的完整历史、挂载正文边缘目录，或控制正文滚动和阅读恢复。</p>
  </main>
  <script>
    const set = (id, value) => { document.getElementById(id).textContent = value; };
    function render(result) {
      const bridge = window.openai;
      set("bridge", bridge ? "window.openai 可用" : "window.openai 未提供");
      set("result", result?.structuredContent?.kind === "chat-host-capability-probe" || result?.kind === "chat-host-capability-probe"
        ? "收到此探针的工具结果" : "等待此探针的工具结果");
      set("theme", typeof bridge?.theme === "string" ? bridge.theme : "未提供");
      set("mode", typeof bridge?.displayMode === "string" ? bridge.displayMode : "未提供");
      set("state", typeof bridge?.setWidgetState === "function" ? "组件状态写入接口可用" : "未提供");
    }
    window.addEventListener("message", event => {
      if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
      if (event.data.method === "ui/notifications/tool-result") render(event.data.params);
    }, { passive: true });
    render(window.openai?.toolOutput);
  </script>
</body>
</html>
