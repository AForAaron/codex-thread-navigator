<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Codex 已知线程目录</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: light-dark(#f7f7f8,#1d1d20); color: light-dark(#242428,#f5f5f5); }
    main { border: 1px solid light-dark(#c5c5cb,#6a6a72); border-radius: 10px; background: light-dark(#fff,#28282d); max-width: 600px; padding: 14px; }
    h1 { margin: 0 0 3px; font-size: 16px; }
    .sub { color: light-dark(#626772,#bbc1cc); font-size: 11px; margin: 0 0 12px; }
    input { width: 100%; min-height: 34px; padding: 6px 9px; border: 1px solid light-dark(#aaa,#777); border-radius: 7px; background: light-dark(#fff,#1f1f23); color: inherit; }
    ol { max-height: 400px; overflow-y: auto; padding-left: 0; margin: 10px 0 0; list-style: none; }
    li { border-bottom: 1px solid light-dark(#ececf0,#444); padding: 6px 3px; display: flex; gap: 9px; }
    .num { flex: 0 0 32px; color: light-dark(#707782,#a9b1be); font-variant-numeric: tabular-nums; }
    .title { overflow-wrap: anywhere; }
    #status { margin: 10px 0 0; color: light-dark(#626772,#bbc1cc); }
  </style>
</head>
<body>
  <main>
    <h1>Codex 已知线程目录</h1>
    <p class="sub">只读轮次标题 · 仅在此工具卡片内筛选；点击后不能滚动宿主对话</p>
    <input id="query" type="search" placeholder="筛选提问标题" aria-label="筛选提问标题" disabled />
    <ol id="entries" aria-live="polite"></ol>
    <p id="status">等待工具结果…</p>
  </main>
  <script>
    const query = document.getElementById("query");
    const entries = document.getElementById("entries");
    const status = document.getElementById("status");
    let directory = null;
    function render() {
      if (!directory) return;
      const needle = query.value.trim().toLocaleLowerCase();
      const filtered = directory.entries.filter(row => row.title.toLocaleLowerCase().includes(needle));
      entries.replaceChildren();
      for (const row of filtered) {
        const li = document.createElement("li");
        const number = document.createElement("span");
        number.className = "num";
        number.textContent = `${row.ordinal}.`;
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = row.title;
        li.append(number, title);
        entries.append(li);
      }
      status.textContent = `已读取 ${directory.turnCount} 轮；当前显示 ${filtered.length} 轮。仅为已知线程的只读目录。`;
    }
    function receive(result) {
      const data = result?.structuredContent ?? result;
      if (data?.kind !== "known-thread-directory" || !Array.isArray(data.entries)) return;
      directory = data;
      query.disabled = false;
      render();
    }
    window.addEventListener("message", event => {
      if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
      if (event.data.method === "ui/notifications/tool-result") receive(event.data.params);
    }, { passive: true });
    receive(window.openai?.toolOutput);
    query.addEventListener("input", render);
  </script>
</body>
</html>
